<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" id="controls">
    <h1>Neon Coast Cover Studio</h1>

    <div class="group">
      <h2>Photos</h2>
      <div class="row">
        <label class="file-btn">Add photos <input id="photos" type="file" accept="image/*" multiple></label>
        <button id="fillAll" type="button">Fill all panels</button>
      </div>
      <div id="photoList" class="photos"></div>
    </div>

    <div class="group">
      <h2>Layout <span id="panelInfo" class="panel-info"></span></h2>
      <div id="layouts" class="chips"></div>
      <div class="row crop-row">
        <label class="slider">Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
        <span class="move-row">
          <button id="moveLeft" type="button" aria-label="Move photo left">←</button>
          <button id="moveUp" type="button" aria-label="Move photo up">↑</button>
          <button id="moveDown" type="button" aria-label="Move photo down">↓</button>
          <button id="moveRight" type="button" aria-label="Move photo right">→</button>
        </span>
      </div>
    </div>

    <div class="group">
      <h2>Grade</h2>
      <div id="grades" class="chips"></div>
      <div class="row">
        <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
        <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
      </div>
    </div>

    <div class="group">
      <h2>Lettering</h2>
      <div class="row lettering-row">
        <label>Title <input id="title" type="text" maxlength="30" value="VICE HEIST"></label>
        <label>Subtitle <input id="subtitle" type="text" maxlength="30" value="Chasing the neon tide"></label>
      </div>
      <label>Badge <input id="badge" type="text" maxlength="16" value="NEON COUNTY"></label>
    </div>

    <div class="group">
      <h2>Export PNG</h2>
      <div class="row">
        <button id="expSquare" type="button">1080 × 1080</button>
        <button id="expPortrait" type="button">1080 × 1350</button>
        <button id="expWide" type="button">1920 × 1080</button>
      </div>
      <div class="row">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <button id="sample" type="button">Load sample</button>
      </div>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
